name: Autotune Regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autotune-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compile board autotune with the host test environment
        run: |
          g++ -std=c++17 -Wall -Wextra -g -fsanitize=address,undefined \
            -Itests/autotune/stubs -I. \
            -Iext/rusefi/firmware/libfirmware/util/include \
            -Iext/rusefi/firmware/libfirmware/util/include/rusefi/containers \
            board_autotune.cpp tests/autotune/lifecycle.cpp -o /tmp/autotune-lifecycle
      - name: Check session restart, RAM apply, persistence, and shutdown
        run: /tmp/autotune-lifecycle
